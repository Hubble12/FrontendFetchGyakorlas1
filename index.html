<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
    <title>Document</title>
</head>
<body>
   
 
<table class="table">
  <thead>
    <tr>
      <th scope="col">id</th>
      <th scope="col">name</th>
      <th scope="col">email</th>
      <th scope="col">city</th>
      <th scope="col">phone</th>
      <th scope="col">role</th>
    </tr>
  </thead>
  <tbody id="usersTableBody">
  </tbody>
</table>
 
 
  <form id="userForm" class="container mt-3">
    <input class="form-control mb-2" type="text" name="name" placeholder="Name" id="bevitelName">
    <input class="form-control mb-2" type="text" name="email" placeholder="Email" id="bevitelEmail">
    <input class="form-control mb-2" type="text" name="city" placeholder="City" id="bevitelCity">
    <input class="form-control mb-2" type="text" name="phone" placeholder="Phone" id="bevitelPhone">
    <input class="form-control mb-2" type="text" name="role" placeholder="Role" id="bevitelRole">
    <input class="form-control mb-2" type="number" id="userId" placeholder="ID">
    <button type="button" class="btn btn-primary" onclick="postData()">Bevitel</button>
    <button type="button" class="btn btn-primary" onclick="putData()">Módosítás</button>
    <button type="button" id="deleteUserButton" class="btn-outline theme-danger" onclick="deleteData()">Delete</button>
 
 
  </form>
 
 
 
 
 
    <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL" crossorigin="anonymous"></script>
    <script src="script.js"></script>
</body>
</html>
